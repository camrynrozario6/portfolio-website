<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body{margin:0;background:transparent}</style>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet"><style>.nkc,.nkc *{box-sizing:border-box;margin:0}.nkc{width:100%;font-family:Geist,sans-serif;color:#3D342D;display:flex;flex-direction:column;gap:14px}.nkc .s{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#F7F6F2;touch-action:pan-y}.nkc .t{display:flex;height:100%;will-change:transform}.nkc .t img{flex:0 0 100%;width:100%;height:100%;object-fit:cover;display:block;user-select:none}.nkc .a{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:#3D342D;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15);opacity:0;transition:opacity .2s}.nkc .s:hover .a{opacity:1}.nkc .l{left:12px}.nkc .r{right:12px}.nkc .p{position:absolute;top:12px;right:12px;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.92);font:500 12px Geist,sans-serif;opacity:0;transition:opacity .2s;pointer-events:none}.nkc .s:hover .p{opacity:1}.nkc .x{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;border-top:1px solid rgba(61,52,45,.13);padding-top:10px}.nkc .x button{flex:none;border:0;background:none;padding:2px 0 4px;font:13px Geist,sans-serif;color:#8A8178;cursor:pointer;white-space:nowrap;border-bottom:1.5px solid transparent;transition:color .2s,border-color .2s}.nkc .x button.on{color:#3D342D;border-color:#3D342D;font-weight:500}@media(hover:none){.nkc .a{opacity:1}}</style><div class="nkc"><div class="s"><div class="t"></div><button class="a l" aria-label="Previous">‹</button><button class="a r" aria-label="Next">›</button><span class="p">❚❚ Paused</span></div><div class="x"></div></div><script>
var SECONDS=4; /* seconds for each slide to glide past. Higher = slower */
var UNNUMBERED=2; /* how many slides at the start have no number (Title, Contents) */
var VISIBLE=0.5; /* how much of the slideshow must be on screen before it starts playing (0.5 = half) */
/* One line per slide, in order: [full image URL, tab label].
   Any image host works. To add a slide, put a comma after the last line and add ["URL","Label"]. */
var SLIDES=[
["../assets/nook-guidelines-01.jpg","Title"],
["../assets/nook-guidelines-02.jpg","Contents"],
["../assets/nook-guidelines-03.jpg","Overview"],
["../assets/nook-guidelines-04.jpg","Logo"],
["../assets/nook-guidelines-05.jpg","Colour"],
["../assets/nook-guidelines-06.jpg","Typography"],
["../assets/nook-guidelines-07.jpg","Iconography"],
["../assets/nook-guidelines-08.jpg","Imagery"],
["../assets/nook-guidelines-09.jpg","Layout"]
];
(function(){var S=SLIDES,n=S.length,R=document.querySelectorAll('.nkc'),c=R[R.length-1],q=function(s){return c.querySelector(s)},t=q('.t'),x=q('.x'),st=q('.s'),pos=0,hov=false,vis=false,cur=-1,tw=null,last=null,a=null;
function add(k,clone){var m=new Image();m.src=S[k][0];m.alt=clone?'':(S[k][1]||'Slide '+(k+1));m.draggable=false;t.appendChild(m)}
S.forEach(function(s,k){add(k);var o=document.createElement('button');var num=k-UNNUMBERED+1;o.textContent=(num>0?('0'+num).slice(-2)+'  ':'')+s[1];o.onclick=function(){jump(k)};x.appendChild(o)});add(0,1);
function mark(){var k=Math.round(pos)%n;if(k==cur)return;cur=k;for(var j=0;j<n;j++)x.children[j].className=j==k?'on':'';var o=x.children[k];x.scrollTo({left:o.offsetLeft-x.offsetLeft-x.clientWidth/2+o.clientWidth/2,behavior:'smooth'})}
function jump(k){var from=pos,to=k;if(to<from-n/2)to+=n;if(to>from+n/2)to-=n;tw={from:from,to:to,t0:performance.now(),d:500}}
function step(now){var dt=last?Math.min(now-last,100):0;last=now;
if(tw){var p=Math.min(1,(now-tw.t0)/tw.d),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;pos=tw.from+(tw.to-tw.from)*e;if(p>=1)tw=null}
else if(!hov&&vis&&SECONDS>0)pos+=dt/(SECONDS*1000);
pos=((pos%n)+n)%n;t.style.transform='translateX(-'+pos*100+'%)';mark();requestAnimationFrame(step)}
q('.l').onclick=function(){jump(Math.round(pos)-1)};q('.r').onclick=function(){jump(Math.round(pos)+1)};
st.addEventListener('mouseenter',function(){hov=true});st.addEventListener('mouseleave',function(){hov=false});
st.addEventListener('pointerdown',function(e){a=e.clientX});st.addEventListener('pointerup',function(e){if(a===null)return;var d=e.clientX-a;if(Math.abs(d)>40)jump(Math.round(pos)+(d<0?1:-1));a=null});
/* Only play while the slideshow is scrolled into view */
if('IntersectionObserver' in window){new IntersectionObserver(function(en){vis=en[0].isIntersecting},{threshold:VISIBLE}).observe(st)}else{vis=true}
requestAnimationFrame(step)})();
</script>
<script>/* tells the page how tall this embed is */(function(){function s(){parent.postMessage({embedHeight:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*")}addEventListener("load",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.documentElement);setTimeout(s,500);})();</script>
