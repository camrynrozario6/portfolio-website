<!doctype html>
<!-- ======================== EDIT THESE ======================== -->
<!-- Photo: paste your image link into src="" (search for PHOTO) -->
<!-- Tape: little fish from your logo on washi tape               -->
<!-- The polaroid fills the whole frame it sits in                -->
<!-- ============================================================ -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --tilt: 0deg;
    --frame: #fdfbf4;
    --tape: #bfddf4;
    --tape-angle: -4deg;
    --fish: #2a4379;
    --fish-opacity: 0.9;
    --focus: 50% 42%;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }

  .stage { width: 100%; height: 100%; container-type: size; }

  .polaroid {
    --u: min(100cqw, 100cqh);
    --top: calc(var(--u) * 0.06);
    --bottom: calc(var(--u) * 0.035);
    position: relative;
    display: flex;
    flex-direction: column;
    margin-top: var(--top);
    width: 100cqw;
    height: calc(100cqh - var(--top) - var(--bottom));
    background: var(--frame);
    padding: calc(var(--u) * 0.045) calc(var(--u) * 0.045) calc(var(--u) * 0.16);
    transform-origin: 50% 0;
    transform: rotate(var(--tilt));
    box-shadow: 0 8px 14px -8px rgba(120, 95, 50, 0.3);
  }

  .polaroid:hover { animation: sway 1.4s ease-out; }

  @keyframes sway {
    0%   { transform: rotate(var(--tilt)); }
    20%  { transform: rotate(calc(var(--tilt) + 1.6deg)); }
    45%  { transform: rotate(calc(var(--tilt) - 1.1deg)); }
    68%  { transform: rotate(calc(var(--tilt) + 0.6deg)); }
    86%  { transform: rotate(calc(var(--tilt) - 0.2deg)); }
    100% { transform: rotate(var(--tilt)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .polaroid:hover { animation: none; }
  }

  .photo {
    flex: 1;
    min-height: 0;
    width: 100%;
    object-fit: cover;
    object-position: var(--focus);
    display: block;
    background: #ece5d6;
  }

  .tape {
    position: absolute;
    top: calc(var(--u) * -0.06);
    left: 50%;
    width: 38%;
    height: calc(var(--u) * 0.12);
    transform: translateX(-50%) rotate(var(--tape-angle));
    background-color: var(--tape);
    opacity: 0.82;
    mix-blend-mode: multiply;
    z-index: 2;
    pointer-events: none;
    clip-path: polygon(
      2% 0%, 98% 0%, 100% 12%, 97% 25%, 100% 38%, 97% 50%, 100% 63%, 97% 75%, 100% 88%, 98% 100%,
      2% 100%, 0% 88%, 3% 75%, 0% 63%, 3% 50%, 0% 38%, 3% 25%, 0% 12%
    );
  }

  .tape svg { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>

<div class="stage">
  <div class="polaroid">
    <div class="tape">
      <svg viewBox="0 0 200 60" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
        <defs>
          <path id="fish" d="M36.4376 26.899C25.7438 37.0787 13.5442 33.2613 8.78117 30.0802L1.40613 20.5367L0.94519 14.6289L5.55459 7.35766L13.3906 2.35871L19.8437 0.995361L27.2188 2.35871L37.8204 9.62991L44.7345 6.44876H49.8048L53.0314 10.0844L50.7267 13.72L48.8829 16.9011V19.6278L51.6486 27.8079L49.8048 30.989H46.1173L36.4376 26.899Z" />
          <pattern id="fishTile" width="60" height="44" patternUnits="userSpaceOnUse" patternTransform="translate(4 3)">
            <g transform="translate(2 2) scale(0.48)" style="opacity: var(--fish-opacity)">
              <use href="#fish" style="fill: var(--fish)" />
              <circle cx="14" cy="14" r="2.6" style="fill: var(--tape)" />
            </g>
            <g transform="translate(58 24) scale(-0.48 0.48)" style="opacity: var(--fish-opacity)">
              <use href="#fish" style="fill: var(--fish)" />
              <circle cx="14" cy="14" r="2.6" style="fill: var(--tape)" />
            </g>
          </pattern>
        </defs>
        <rect width="200" height="60" fill="url(#fishTile)" />
      </svg>
    </div>

    <!-- PHOTO: to swap, put a new image in assets/ and change src below -->
    <img
      class="photo"
      src="../assets/camryn-about.jpg"
      alt="Photo of Camryn"
    />
  </div>
</div>
