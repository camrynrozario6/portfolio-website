<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>nook · features</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Caladea:ital@1&family=Gochi+Hand&display=swap" rel="stylesheet"><style>
:root{
--bg:#f5f3ef; --card:#fff; --ink:#4a3a30; --title:#5a4335; --muted:#8c8076;
--brown:#6b4c3b; --brown-h:#5a3e30; --nav:#e3ddd0; --line:#d9d3ca;
--chip:#e6e1d4; --chip-ink:#8a7f6e; --star:#6b4c3b; --star-off:#bcb7b0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:transparent}
body{font-family:"Manrope",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#fit{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;margin:-360px 0 0 -640px;transform-origin:center center}
#phoneWrap{position:absolute;left:50%;top:50%;width:314px;height:638px;margin:-330px 0 0 -157px;z-index:2;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#stage.hot #phoneWrap{transform:translateY(-6px) scale(1.03)}
#tilt{position:relative;width:100%;height:100%;transition:transform .25s ease-out;filter:drop-shadow(0 34px 34px rgba(70,50,30,.28)) drop-shadow(0 10px 12px rgba(70,50,30,.18))}
#tilt>img.frame{position:absolute;inset:0;width:100%;height:100%}
.lay{position:absolute;overflow:hidden}
#scr{left:5.316%;top:2.209%;width:89.369%;height:95.417%;border-radius:13% / 6.2%;cursor:none}
#feed{left:5.316%;top:18.494%;width:89.369%;height:69.885%}
.track{display:flex;width:200%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1)}
.track.social{transform:translateX(-50%)}
.track img{width:50%;height:100%;display:block;transition:opacity .45s}
.track:not(.social) img.sp,.track.social img.ev{opacity:.2}
#ptabs{left:7.641%;top:14.566%;width:37.542%;height:3.764%}
#ptabs img{position:absolute;inset:0;width:100%;height:100%;transition:opacity .35s}
#ptabs img.sp{opacity:0}#ptabs.social img.sp{opacity:1}#ptabs.social img.ev{opacity:0}
#ptabs button{position:absolute;top:0;height:100%;z-index:2;cursor:none}
.tabs{display:flex;position:relative;color:#a19a92;border-bottom:1px solid #d9d3ca;width:max-content}
.tabs button{padding:0 2px 5px;margin-right:16px;transition:color .3s}
.tabs button:last-of-type{margin-right:2px}
.tabs button.on{color:#5a4232}
.tabs button:hover{color:#5a4232}
.tabs .ind{position:absolute;left:0;bottom:-1px;height:1.5px;background:#5a4232;transition:transform .45s cubic-bezier(.2,.8,.2,1),width .45s cubic-bezier(.2,.8,.2,1)}
#dot{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:rgba(150,150,150,.55);
border:1.5px solid rgba(255,255,255,.7);box-shadow:0 1px 4px rgba(0,0,0,.2);pointer-events:none;z-index:60;opacity:0;transition:opacity .2s,transform .12s}
#dot.on{opacity:1}#dot.down{transform:scale(.75)}
.float{position:absolute;z-index:3;pointer-events:none;opacity:0;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .5s}
#stage.hot .float,#stage.show .float{opacity:1;transform:none!important;pointer-events:auto}
#stage.auto .float{transition:transform 1.1s cubic-bezier(.2,.8,.2,1),opacity .8s ease}
#stage.auto #fTabs{transition-delay:.25s}#stage.auto #fPop{transition-delay:.65s}#stage.auto #fToggle{transition-delay:1.05s}
#stage.auto .lbl{opacity:0;translate:0 12px;transition:opacity .7s ease,translate .9s cubic-bezier(.2,.8,.2,1);transition-delay:inherit}
#stage.auto.show .lbl{opacity:1;translate:0 0}
#stage.auto #phoneWrap{opacity:0;transform:translateY(26px) scale(.97);transition:opacity .8s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
#stage.auto.show #phoneWrap{opacity:1;transform:none}
#stage.auto.show.hot #phoneWrap{transform:translateY(-6px) scale(1.03);transition:transform .6s cubic-bezier(.2,.8,.2,1)}
#stage.m.auto.show.hot #phoneWrap{transform:none}
#stage.auto #hint{display:none}
#stage.m{width:420px;height:1330px;margin:-665px 0 0 -210px}
#stage.m #phoneWrap{top:172px;margin:0 0 0 -150px;width:300px;height:609px}
#stage.m .float{left:50%!important;margin-left:-170px;width:340px!important}
#stage.m:not(.show) .float{transform:translateY(28px) scale(.96)!important}
#stage.m .lbl{text-align:center;margin:0 0 12px}
#stage.m #fTabs{top:18px}#stage.m #fTabs .box{display:flex;justify-content:center}
#stage.m #fPop{top:812px}
#stage.m #fToggle{top:1212px}
.fsh{box-shadow:0 1px 3px rgba(60,40,20,.06),0 30px 50px -24px rgba(80,55,35,.45)}
.lbl{font-family:"Manrope",sans-serif;font-size:24px;font-weight:500;line-height:1.2;color:#141416;margin:0 0 12px 2px;letter-spacing:-.3px;text-wrap:balance}
.lbl b{margin-right:4px}
.lbl em{font-family:"Caladea",serif;font-style:italic;font-weight:400;font-size:1.12em;letter-spacing:0}
.lbl b{font-weight:600;color:#141416}
#fPop{left:140px;top:120px;width:310px;transform:translate(170px,30px) scale(.9);transition-delay:.05s}
.modal{background:#fff;border-radius:10px;padding:20px 18px 16px;position:relative}
.modal .x{position:absolute;top:12px;right:12px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.modal .x:hover{background:#f1ece5}
.modal img{display:block;width:70px}
.modal .ribbon{transform-origin:50% 0;animation:sway 3.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.modal h2{font-weight:400;font-size:23px;line-height:1.2;color:var(--title);margin:10px 0 8px}
.modal p{font-size:12.5px;line-height:1.5;color:#3d322a;margin-bottom:14px}
.cta{height:42px;border-radius:21px;background:var(--brown);color:#fff;font-size:14px;width:100%;transition:background .2s,transform .15s}
.cta:hover{background:var(--brown-h)}.cta:active{transform:scale(.98)}
#fTabs{left:812px;top:110px;width:330px;transform:translate(-170px,0) scale(.9);transition-delay:.12s}
#fTabs .box{background:var(--bg);border-radius:12px;padding:16px 18px 14px}
#fTabs .tabs{font-size:22px}
#fTabs .tabs button{margin-right:22px}
#fToggle{left:812px;top:390px;width:330px;transform:translate(-170px,-10px) scale(.9);transition-delay:.18s}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;height:50px;border-radius:25px;background:#e2ddd0;padding:3px;box-shadow:inset 0 0 0 1px #ddd7c9}
.seg .thumb{position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:22px;background:#fff;
box-shadow:0 1px 3px rgba(60,40,20,.12);transition:transform .45s cubic-bezier(.3,1.3,.5,1)}
.seg.re .thumb{transform:translateX(100%)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:9px;font-size:16px;color:#6a4a38}
.seg svg{width:17px;height:17px}
.seg .bolt{transition:transform .3s}.seg:not(.re) .bolt{animation:zap .5s ease}
.seg .spin{transition:transform .6s cubic-bezier(.3,1,.4,1)}.seg.re .spin{transform:rotate(180deg)}
@keyframes zap{30%{transform:scale(1.25) rotate(-8deg)}}
#hint{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;z-index:4;
}
#hint .k{font-size:12.5px;color:#6b4c3b;background:#f5f3ef;border:1px solid #e3dacd;border-radius:14px;padding:5px 11px;display:inline-flex;align-items:center;gap:6px}
#hint .k i{width:8px;height:8px;border-radius:50%;background:var(--brown);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
@media (hover:none){ #dot{display:none} }
@media (prefers-reduced-motion:reduce){ *{animation-duration:.01s!important;transition-duration:.01s!important} }
#fPop{left:218px!important;top:150px!important;width:252px!important}
#fPop .modal{padding:15px 15px 13px}
#fPop .modal img{width:52px}
#fPop .modal h2{font-size:18.5px;margin:7px 0 6px}
#fPop .modal p{font-size:10.5px;line-height:1.45;margin-bottom:11px}
#fPop .modal .x{top:8px;right:8px;width:24px;height:24px}
#fPop .cta{height:34px;font-size:12px}
#fTabs{left:810px!important;top:150px!important;width:270px!important}
#fTabs .box{padding:11px 14px 10px!important}
#fTabs .tabs{font-size:17.5px!important}
#fTabs .tabs button{margin-right:16px!important}
#fToggle{left:810px!important;top:392px!important;width:262px!important}
#fToggle .seg{height:40px}
#fToggle .seg button{font-size:13px;gap:7px}
#fToggle .seg svg{width:14px;height:14px}

(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const stage=$('#stage'), fit=$('#fit'), screen=$('#tilt'), scr=$('#scr'), dot=$('#dot'), tilt=$('#tilt');
const noHover=matchMedia('(hover: none)').matches;
let shown=false;
function rescale(){
const w=fit.clientWidth, h=fit.clientHeight;
// layout follows the embed's shape: tall box = stacked, wide box = side-by-side
const m = false;  // same side-by-side layout on every device
// device class follows the real screen width (the embed may sit in a narrow column)
let vw=innerWidth; try{ vw=Math.max(vw, window.top.innerWidth||0); }catch(e){ vw=Math.max(vw, screen.width||0); }
stage.classList.toggle('m',m);
stage.classList.add('auto');  // cards + titles always animate in on load
// fit to the content (phone + cards + titles ≈ 900×690), not the full 1280×720 canvas
const W=m?420:900, H=m?1330:690, k=Math.min(w/W, h/H);
stage.style.transform='scale('+k+')'; positionInd();
if(stage.classList.contains('auto') && shown) stage.classList.add('show');
if(!stage.classList.contains('auto')) stage.classList.remove('show');
}
if('IntersectionObserver' in window){
new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ shown=true; if(stage.classList.contains('auto')){ stage.classList.add('show'); setTimeout(startAuto,1800);} } else if(stage.classList.contains('auto')) stopAuto(); }),{threshold:.25}).observe(fit);
} else { shown=true; }
addEventListener('resize',rescale);
fit.addEventListener('mouseenter',()=>stage.classList.add('hot'));
fit.addEventListener('mouseleave',()=>{ tilt.style.transform=''; stage.classList.remove('hot'); });
fit.addEventListener('mousemove',e=>{
const r=fit.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
tilt.style.transform=`perspective(1600px) rotateY(${x*6}deg) rotateX(${-y*5}deg)`;
});
screen.addEventListener('mousemove',e=>{
const r=scr.getBoundingClientRect(), k=r.width/scr.offsetWidth, x=(e.clientX-r.left)/k, y=(e.clientY-r.top)/k;
const inside=x>0&&y>0&&x<scr.offsetWidth&&y<scr.offsetHeight;
dot.style.left=x+'px'; dot.style.top=y+'px'; dot.classList.toggle('on',inside); tilt.style.cursor=inside?'none':'';
});
screen.addEventListener('mouseleave',()=>dot.classList.remove('on'));
screen.addEventListener('mousedown',()=>dot.classList.add('down'));
addEventListener('mouseup',()=>dot.classList.remove('down'));
let tab='events';
function positionInd(){
$$('.tabs').forEach(t=>{
const on=t.querySelector('button.on'), ind=t.querySelector('.ind');
ind.style.width=on.offsetWidth+'px'; ind.style.transform=`translateX(${on.offsetLeft}px)`;
});
}
function setTab(v){
tab=v;
$$('[data-tab]').forEach(b=>b.classList.toggle('on',b.dataset.tab===v));
$('#track').classList.toggle('social',v==='social'); $('#ptabs').classList.toggle('social',v==='social');
positionInd();
}
$$('[data-tab]').forEach(b=>b.addEventListener('click',()=>{userTouched=true;setTab(b.dataset.tab);}));
const seg=$('#seg');
function setSeg(v){seg.classList.toggle('re',v==='re');}
$$('[data-seg]').forEach(b=>b.addEventListener('click',()=>{userTouched=true;setSeg(b.dataset.seg);}));
let auto=null, userTouched=false, tick=0;
function startAuto(){ if(auto) return; auto=setInterval(()=>{ if(userTouched) return stopAuto(); tick++;
if(tick%2) setSeg(seg.classList.contains('re')?'one':'re'); else setTab(tab==='events'?'social':'events'); },1900); }
function stopAuto(){ clearInterval(auto); auto=null; }
rescale();
if(document.fonts) document.fonts.ready.then(positionInd);
})();
</script></body></html>
