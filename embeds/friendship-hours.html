<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friendship Hours Track</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #141416;
    --muted: #6B6B70;
    --rail: #E4E4E8;
    --chip: #ECECF0;
    --chip-dark: #E25454;
    --glyph: #9A9AA0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: 'Geist', -apple-system, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }

  .wrap { width: 100%; padding: 0; container-type: inline-size; container-name: fh; }
  h2 { font-size: 20px; font-weight: 500; line-height: 1.3; margin: 0 0 20px; }

  .track { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
  .rail, .fill {
    position: absolute; top: 22px; left: 12.5%; right: 12.5%; height: 6px; border-radius: 99px;
  }
  .rail { background: var(--rail); }
  .fill {
    background: #E25454;
    transform-origin: left center;
  }

  .stop { position: relative; text-align: center; min-width: 0; padding: 0 4px; }
  .icon {
    width: 50px; height: 50px; margin: 0 auto 10px; border-radius: 13px;
    display: grid; place-items: center; background: var(--c);
    box-shadow: 0 4px 10px rgba(20, 20, 26, .12), 0 0 0 1px rgba(20, 20, 26, .04);
    transform: rotate(var(--r));
    position: relative; z-index: 1;
  }
  .icon svg { width: 28px; height: 28px; transform: rotate(calc(var(--r) * -1)); }
  .num { font-size: 20px; font-weight: 500; line-height: 1.2; margin: 0; white-space: nowrap; }
  .num small { font-size: 20px; font-weight: 400; color: var(--muted); }
  .name { font-size: 20px; font-weight: 400; line-height: 1.25; color: var(--muted); margin: 2px 0 0; }

  .legend { margin: 16px 0 0; font-size: 14px; line-height: 1.35; font-weight: 400; font-style: italic; color: var(--muted); }

  @container fh (max-width: 479px) {
    h2 { font-size: 20px; margin-bottom: 16px; }
    .icon { width: 40px; height: 40px; border-radius: 10px; }
    .icon svg { width: 22px; height: 22px; }
    .rail, .fill { top: 17px; }
    .num, .num small, .name { font-size: 15px; }
    .legend { font-size: 13px; }
  }

  /* Motion */
  @media (prefers-reduced-motion: no-preference) {
    .js .fill { transform: scaleX(0); transition: transform 1.8s cubic-bezier(.45,.05,.3,1); }
    .js .in .fill { transform: scaleX(1); }
    .js .icon { transform: rotate(var(--r)) scale(.4); opacity: 0; transition: transform .5s cubic-bezier(.3,1.6,.5,1), opacity .3s; }
    .js .in .icon { transform: rotate(var(--r)) scale(1); opacity: 1; }
    .js .in .stop:nth-child(4) .icon { transition-delay: .05s; }
    .js .in .stop:nth-child(5) .icon { transition-delay: .6s; }
    .js .in .stop:nth-child(6) .icon { transition-delay: 1.15s; }
    .js .in .stop:nth-child(7) .icon { transition-delay: 1.7s; }
    .js .num, .js .name { opacity: 0; transition: opacity .4s; }
    .js .in .num, .js .in .name { opacity: 1; }
    .js .in .stop:nth-child(5) .num, .js .in .stop:nth-child(5) .name { transition-delay: .6s; }
    .js .in .stop:nth-child(6) .num, .js .in .stop:nth-child(6) .name { transition-delay: 1.15s; }
    .js .in .stop:nth-child(7) .num, .js .in .stop:nth-child(7) .name { transition-delay: 1.7s; }
    .done .icon { animation: wiggle 6s ease-in-out infinite; }
    .done .stop:nth-child(5) .icon { animation-delay: 1.5s; }
    .done .stop:nth-child(6) .icon { animation-delay: 3s; }
    .done .stop:nth-child(7) .icon { animation-delay: 4.5s; }
    .done .stop:nth-child(7) .icon svg { animation: beat 1.4s ease-in-out infinite; }
  }
  @keyframes wiggle {
    0%, 12%, 100% { transform: rotate(var(--r)) scale(1); }
    4% { transform: rotate(calc(var(--r) * -1.6)) scale(1.1); }
    8% { transform: rotate(calc(var(--r) * 1.4)) scale(1.05); }
  }
  @keyframes beat {
    0%, 100% { transform: rotate(calc(var(--r) * -1)) scale(1); }
    20% { transform: rotate(calc(var(--r) * -1)) scale(1.2); }
    40% { transform: rotate(calc(var(--r) * -1)) scale(1); }
  }
</style>
</head>
<body>
<section class="wrap">
  <h2>Friendship takes hours, not one event.</h2>

  <div class="track">
    <span class="rail" aria-hidden="true"></span>
    <span class="fill" aria-hidden="true"></span>

    <div class="stop">
      <div class="icon" style="--c:var(--chip);--r:0deg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.5" fill="var(--glyph)"/><path d="M3.5 21.5c0-4.8 3.9-7.5 8.5-7.5s8.5 2.7 8.5 7.5z" fill="var(--glyph)"/></svg>
      </div>
      <p class="num"><span class="count" data-to="0">0</span> <small>hrs</small></p>
      <p class="name">Acquaintance</p>
    </div>

    <div class="stop">
      <div class="icon" style="--c:var(--chip);--r:0deg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3.5 9h13v5.5A5.5 5.5 0 0 1 11 20H9a5.5 5.5 0 0 1-5.5-5.5z" fill="var(--glyph)"/><path d="M16.5 10.5h1.2a2.8 2.8 0 0 1 0 5.6h-1.6" fill="none" stroke="var(--glyph)" stroke-width="2.2"/><path d="M8 2.5v3.5M12 2.5v3.5" stroke="var(--glyph)" stroke-width="2.2" stroke-linecap="round"/></svg>
      </div>
      <p class="num"><span class="count" data-to="50">50</span> <small>hrs</small></p>
      <p class="name">Casual friend</p>
    </div>

    <div class="stop">
      <div class="icon" style="--c:var(--chip);--r:0deg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M3 5.5A2.5 2.5 0 0 1 5.5 3h13A2.5 2.5 0 0 1 21 5.5v9a2.5 2.5 0 0 1-2.5 2.5H10l-5.5 4.5V17A2.5 2.5 0 0 1 3 14.5z" fill="var(--glyph)"/><path d="M8 8.5h8M8 12h5" stroke="#ECECF0" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <p class="num"><span class="count" data-to="90">90</span> <small>hrs</small></p>
      <p class="name">Friend</p>
    </div>

    <div class="stop">
      <div class="icon" style="--c:var(--chip-dark);--r:0deg" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M12 21s-8.5-5-8.5-11.2A4.6 4.6 0 0 1 12 7a4.6 4.6 0 0 1 8.5 2.8C20.5 16 12 21 12 21z" fill="#fff"/></svg>
      </div>
      <p class="num"><span class="count" data-to="200" data-plus="1">200+</span> <small>hrs</small></p>
      <p class="name">Close friend</p>
    </div>
  </div>

  <p class="legend">Source: Hall (2019), <em>How many hours does it take to make a friend?</em></p>
</section>

<script>
(function(){
  var root=document.querySelector('.wrap');
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce||!('IntersectionObserver' in window)) return;
  document.documentElement.classList.add('js');
  var delays=[0,600,1150,1700];
  function count(el,delay){
    var to=+el.dataset.to, plus=el.dataset.plus, d=700;
    el.textContent='0';
    setTimeout(function(){
      var t0=null;
      function f(t){ if(!t0)t0=t; var p=Math.min((t-t0)/d,1), e=1-Math.pow(1-p,3);
        el.textContent=Math.round(to*e)+(plus&&p===1?'+':''); if(p<1)requestAnimationFrame(f); }
      requestAnimationFrame(f);
    },delay);
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){
      root.classList.add('in');
      root.querySelectorAll('.count').forEach(function(el,i){ count(el,delays[i]); });
      setTimeout(function(){ root.classList.add('done'); },2400);
      io.disconnect(); } });
  },{threshold:.3});
  io.observe(root);
})();
</script>
<script>/* tells the page how tall this embed is */(function(){function s(){parent.postMessage({embedHeight:Math.ceil(document.documentElement.getBoundingClientRect().height)},"*")}addEventListener("load",s);if(window.ResizeObserver)new ResizeObserver(s).observe(document.documentElement);setTimeout(s,500);})();</script>
</body>
</html>
